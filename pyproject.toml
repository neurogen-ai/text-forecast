[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
text-forecast = "main:app"

[project]
name = 'text-forecast'
description = 'Forecast outcomes from text corpora over time, with NLP'

version = '2.3.0'
requires-python = '>=3.13,<3.14'

readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]

dependencies = [
    'polars==1.38.1',
    'pandas==2.3.3',
    'mlflow==3.9.0',
    'transformers==4.48.0',
    'scikit-learn==1.8.0',
    'typer==0.23.1',
    'seaborn==0.13.2',
]

[project.optional-dependencies]
modal = ["modal>=0.73.0"]
rocm = ["torch>=2.10"]
rocm10 = ["torch>=2.10"]
cuda126 = ["torch"]
cuda130 = ["torch"]

[dependency-groups]
dev = ["pytest>=8.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
conflicts = [
    [
        { extra = "cuda126" },
        { extra = "cuda130" },
        { extra = "rocm10" },
        { extra = "rocm" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-rocm10", extra = "rocm10" },
    { index = "pytorch-rocm714", extra = "rocm" },
    { index = "pytorch-cu126", extra = "cuda126" },
    { index = "pytorch-cu130", extra = "cuda130" },
]

triton-rocm = [
    { index = "pytorch-rocm10", extra = "rocm10" },
    { index = "pytorch-rocm714", extra = "rocm" },
]

[[tool.uv.index]]
name = "pytorch-rocm10"
url = "https://download.pytorch.org/whl/nightly/rocm10.0"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm714"
url = "https://download.pytorch.org/whl/rocm7.14"
explicit = true


[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

authors = [
    { name = 'Felix Noble', email = 'felix.noble@live.co.uk' }
]
